name: CICD

on:
  push:
    branches:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkot Source
        uses: actions/checkout@v4
      - name: login to Docker Hub
        run:  echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker Image
        run: docker build -t aws26kathir/reactdevops:latest .
      - name: Publish image to docker hub
        run: docker push aws26kathir/reactdevops:latest
  deploy:
    needs:build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image from docker hub
        run: docker pull aws26kathir/reactdevops:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run Docker Container
        run: docker run -d -p 3000:80 --name reactContainer aws26kathir/reactdevops:latest


        
